<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>超级弹珠</title><style>*{box-sizing:border-box}body{margin:0;background:#101013;color:#eee;font:16px system-ui;text-align:center}main{max-width:480px;margin:auto;padding:12px}h1{color:#ffd46b;text-shadow:0 2px #8c260d;letter-spacing:5px}button,input,select{font:inherit;padding:10px;border-radius:7px;border:1px solid #8d7751;margin:4px;background:#25252a;color:white}button{background:linear-gradient(#b92e35,#661018);border:2px solid #d5a65b;cursor:pointer}button:disabled{opacity:.4}canvas{width:100%;touch-action:none;border:6px ridge #b5a17b;border-radius:16px;background:#20252a}.panel{background:#222;border:2px solid #806332;border-radius:10px;padding:8px;margin:8px 0}.digits{color:#ffb53b;font: bold 22px monospace}small{color:#aaa}input{max-width:130px}#status{min-height:25px;color:#ffcf78}</style><main><h1>超级弹珠</h1><small>SUPER MARBLE · ARCADE</small><section id="lobby" class="panel"><input id="name" placeholder="昵称"><select id="mode"><option value="turn">轮流对战</option><option value="sync">同步对战</option></select><select id="minutes"><option value="0">自由畅玩</option><option value="5">5分钟</option><option value="10">10分钟</option><option value="20">20分钟</option><option value="30">30分钟</option></select><button onclick="create()">创建房间</button><br><input id="code" placeholder="六位房间号"><button onclick="join()">加入</button></section><section id="game" hidden><div id="info" class="panel"></div><div id="host" class="panel"><button onclick="act('start')">开始</button><select id="target"><option value="0">玩家1</option><option value="1">玩家2</option></select><input id="grant" type="number" value="100" min="1"><button onclick="act('grant',{n:+grant.value,target:+target.value})">发放</button><button onclick="act('finish')">结束</button></div><div id="mult" class="digits"></div><canvas id="board" width="400" height="470"></canvas><div id="status"></div><input id="amount" type="number" value="5" min="1"><button onclick="act('bet',{n:+amount.value})">投入</button><button onclick="act('add',{n:+amount.value})">追加</button><button onclick="soundOn()">声音开关</button><div class="panel" id="log"></div></section><small>仅供娱乐 · 虚拟积分不可兑换现金</small></main><script>
let room='',token='',idx=0,state,drag=0,held=false,audio=null,enabled=true,lastSound='',busy=false;const $=id=>document.getElementById(id),canvas=$('board'),ctx=canvas.getContext('2d');function soundOn(){enabled=!enabled;if(enabled)tone(500,.12)}function tone(f,d=.08){if(!enabled)return;try{audio??=new AudioContext();audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.setValueAtTime(f,audio.currentTime);o.frequency.exponentialRampToValueAtTime(f/2,audio.currentTime+d);g.gain.setValueAtTime(.13,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch{}}
async function act(action,extra={}){if(busy)return;busy=true;try{let res=await fetch('/api',{method:'POST',body:JSON.stringify({action,room,token,...extra})}),v=await res.json();if(v.error)throw Error(v.error);state=v.state;room=state.code;token=v.token;idx=v.index;$('lobby').hidden=true;$('game').hidden=false;render();if(action!=='poll')tone(action==='shoot'?150:800)}catch(e){$('status').textContent=e.message;if(!room)alert(e.message)}finally{busy=false}}function create(){act('create',{name:$('name').value,mode:$('mode').value,minutes:+$('minutes').value})}function join(){room=$('code').value;act('join',{name:$('name').value})}setInterval(()=>{if(token)act('poll')},350);
function render(){let p=state.players[idx],q=p.round;$('host').hidden=idx!==0;$('info').replaceChildren();let s=document.createElement('div');s.textContent='房间 '+room+' · '+(state.ended?'已结束':state.started?(state.mode==='turn'?'轮到 '+state.players[state.turn]?.name:'同步对战'):'等待开始')+(state.deadline?' · '+Math.max(0,Math.ceil((state.deadline-Date.now())/1000))+'秒':'');$('info').append(s);for(let x of state.players){let d=document.createElement('div');d.className='digits';d.textContent=x.name+'：'+x.balance+' 颗';$('info').append(d)}$('mult').textContent=q?`${q.mult}×  ·  投入 ${q.bet}`:'2×  4×  6×  8×  10×';$('status').textContent=q?(q.end?'弹珠滚动中…':'向下拉动右侧弹簧后松手'):p.last?`上局${p.last.win?'命中':'未命中'} · 返还 ${p.last.gross} · 赠送 ${p.last.bonus}`:'投入至少5颗开始';$('log').textContent=state.log.join(' ｜ ')}
function circle(x,y,r,c){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=c;ctx.fill()}function draw(){requestAnimationFrame(draw);ctx.clearRect(0,0,400,470);let g=ctx.createLinearGradient(0,0,400,470);g.addColorStop(0,'#531b23');g.addColorStop(.5,'#151b20');g.addColorStop(1,'#651a22');ctx.fillStyle=g;ctx.fillRect(0,0,400,470);ctx.strokeStyle='#c9a65e';ctx.lineWidth=4;ctx.strokeRect(12,12,335,445);let p=state?.players[idx],q=p?.round;for(let r=0;r<9;r++)for(let c=0;c<8-(r%2);c++){let x=33+c*42+(r%2)*21,y=85+r*33;circle(x,y,5,'#b9bfc4');circle(x-1,y-2,2,'#fff')}for(let i=0;i<8;i++){let x=15+i*41;ctx.fillStyle='#333';ctx.fillRect(x,393,39,61);circle(x+19,410,11,q?.lights.includes(i)?'#ffcf43':'#49453c');ctx.fillStyle='#fff';ctx.font='15px monospace';ctx.fillText(i+1,x+15,445)}ctx.fillStyle='#101014';ctx.fillRect(355,20,40,440);ctx.strokeStyle='#aaa';ctx.lineWidth=3;ctx.beginPath();for(let i=0;i<22;i++){let y=320+drag+i*(100-drag)/22;ctx.lineTo(i%2?386:362,y)}ctx.stroke();circle(374,432,13,'#b52c36');let x=375,y=300+drag;if(q?.end){let t=Math.max(0,Math.min(1,1-(q.end-Date.now())/4200)),z=t*(q.path.length-1),j=Math.floor(z),f=z-j;x=20+41*(q.path[j]*(1-f)+(q.path[Math.min(j+1,q.path.length-1)])*f+.5);y=t<.16?300-t/.16*260:40+(t-.16)/.84*400;let key=q.end+':'+j;if(key!==lastSound){lastSound=key;tone(700+j*35,.045)}}let b=ctx.createRadialGradient(x-3,y-4,1,x,y,9);b.addColorStop(0,'white');b.addColorStop(1,'#677782');circle(x,y,9,b)}draw();canvas.onpointerdown=e=>{if(!state?.players[idx].round||state.players[idx].round.end)return;held=true;canvas.setPointerCapture(e.pointerId);drag=0};canvas.onpointermove=e=>{if(held)drag=Math.max(0,Math.min(85,(e.clientY-canvas.getBoundingClientRect().top)*470/canvas.clientHeight-300))};canvas.onpointerup=()=>{if(held){held=false;act('shoot',{power:Math.max(.1,drag/85)});drag=0}};canvas.onpointercancel=()=>{held=false;drag=0};</script></html>
